name: secret-check
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the secret is available
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "APP_TOKEN is set for this job"
          else
            echo "APP_TOKEN is missing"
            exit 1
          fi
