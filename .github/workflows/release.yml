name: release
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint
        run: echo "lint clean"
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Unit tests
        run: echo "all tests passed"
  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Package
        run: echo "packaging the release"
