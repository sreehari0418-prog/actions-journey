name: report
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the report
        run: |
          echo "Build report" > report.txt
          date >> report.txt
          uname -a >> report.txt
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: report.txt
          retention-days: 5
